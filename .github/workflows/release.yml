name: Release

# Builds the Windows executable and installer and attaches them to a release.
#
# PyInstaller does not cross-compile, so this has to run on Windows. Pushing a
# vX.Y.Z tag builds and uploads automatically; workflow_dispatch covers a
# release that was already tagged before this workflow existed, and lets a build
# be re-run without moving the tag. Pull requests touching the packaging or what
# goes into it build too, but upload nothing to a release — the point there is to
# find out the build is broken before merging, not after tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v1.0.0)"
        required: true
        type: string
  # Build on any pull request that touches packaging or what gets packaged, so a
  # broken build is caught before merge rather than at release time. Nothing is
  # uploaded to a release on this path — the assets are attached to the workflow
  # run, where they can be downloaded and tried.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "patterns.yaml"
      - "*.py"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Work out what is being built
        id: version
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              tag="${{ inputs.tag }}"
              version="${tag#v}"
              checkout_ref="$tag"
              ;;
            pull_request)
              # No tag exists; version the artifacts after the PR so they are
              # obviously not a release build.
              tag=""
              version="0.0.0-pr${{ github.event.number }}"
              checkout_ref=""
              ;;
            *)
              tag="${GITHUB_REF#refs/tags/}"
              version="${tag#v}"
              checkout_ref="$tag"
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      - uses: actions/checkout@v4
        with:
          # A tag build takes the tagged commit, not whatever master is at now.
          # Empty means the default ref, which is what a pull request wants.
          ref: ${{ steps.version.outputs.checkout_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        # Windows has tkinter, so the GUI tests that skip on Linux run here.
        run: python -m unittest discover -s tests -t .

      - name: Build the executable
        run: pyinstaller packaging/speccleanse.spec --noconfirm

      - name: Check the executable was produced
        shell: bash
        run: |
          test -f dist/SpecCleanse.exe || { echo "PyInstaller produced no exe"; exit 1; }
          ls -lh dist/SpecCleanse.exe

      - name: Locate Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not present on the runner; installing it."
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Could not find ISCC.exe after installing Inno Setup" }
          Write-Host "Using $iscc"
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the installer
        run: >
          & "${{ steps.iscc.outputs.path }}"
          /DAppVersion=${{ steps.version.outputs.version }}
          packaging\installer.iss
        shell: pwsh

      - name: Name the portable executable after its version
        shell: bash
        run: |
          cp dist/SpecCleanse.exe "dist/SpecCleanse-${{ steps.version.outputs.version }}-portable.exe"
          ls -lh dist/

      - name: Upload build artifacts
        # Kept regardless of whether the release upload below succeeds, so a
        # failed upload does not mean rebuilding.
        uses: actions/upload-artifact@v4
        with:
          name: speccleanse-windows-${{ steps.version.outputs.version }}
          path: |
            dist/SpecCleanse-${{ steps.version.outputs.version }}-portable.exe
            dist/SpecCleanse-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach the assets to the release
        # Pull requests stop at the artifact above; only a tag produces a release.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          # The release may not exist yet when a tag is pushed on its own.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No release for $tag yet — creating one from the tag."
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" \
            "dist/SpecCleanse-${version}-portable.exe" \
            "dist/SpecCleanse-Setup-${version}.exe" \
            --clobber
