name: Release

# Builds the Windows executable and installer and attaches them to a release.
#
# PyInstaller does not cross-compile, so this has to run on Windows. Pushing a
# vX.Y.Z tag builds and uploads automatically; workflow_dispatch re-runs a build
# against an existing tag without having to move it. Pull requests touching the
# packaging or what goes into it build too, but upload nothing to a release — the
# point there is to find out the build is broken before merging, not after
# tagging.
#
# A tag can only be built if it contains the packaging, which is checked below.
# Tags cut before it existed cannot be backfilled with assets.
#
# THIRD_PARTY_NOTICES.txt ships beside both executables: the installer installs
# it, and it is attached to the release (and to a pull request's workflow run)
# next to the portable one, which has nowhere of its own to carry it. Before
# anything is built it is checked against the license files installed on this
# runner, so the texts shipped are the ones of the Python, Tcl/Tk, lxml, PyYAML
# and PyInstaller actually being bundled.
#
# LICENSE.md is attached too, so the portable executable's own terms travel with
# it as a file and not only inside its About dialog. So is the source of GNU
# libiconv, which lxml's Windows wheel compiles into etree.pyd under the LGPL,
# together with the lxml source it is linked into: LGPL-2.1 section 6(d) lets a
# binary be distributed from a place only if the corresponding source can be
# copied from that same place. Both are fetched at pinned revisions and checked
# before anything is uploaded.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v1.0.0)"
        required: true
        type: string
  # Build on any pull request that touches packaging or what gets packaged, so a
  # broken build is caught before merge rather than at release time. Nothing is
  # uploaded to a release on this path — the assets are attached to the workflow
  # run, where they can be downloaded and tried.
  #
  # The filter below is root-level on purpose. "*.py" does not cross a "/", so it
  # matches the modules that go into the executable and not tests/ or tools/,
  # which do not. Those are covered by tests.yml, which runs on every pull
  # request; building an installer because a test changed would be waste. What
  # used to be wrong was not this filter but that no other workflow existed, so a
  # test-only pull request triggered nothing at all.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "patterns.yaml"
      - "THIRD_PARTY_NOTICES.txt"
      - "LICENSE.md"
      - "*.py"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Work out what is being built
        id: version
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              tag="${{ inputs.tag }}"
              version="${tag#v}"
              checkout_ref="$tag"
              ;;
            pull_request)
              # No tag exists; version the artifacts after the PR so they are
              # obviously not a release build.
              tag=""
              version="0.0.0-pr${{ github.event.number }}"
              checkout_ref=""
              ;;
            *)
              tag="${GITHUB_REF#refs/tags/}"
              version="${tag#v}"
              checkout_ref="$tag"
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      - uses: actions/checkout@v4
        with:
          # A tag build takes the tagged commit, not whatever master is at now.
          # Empty means the default ref, which is what a pull request wants.
          ref: ${{ steps.version.outputs.checkout_ref }}

      - name: Check this ref contains the packaging
        # A tag build populates the workspace from that tag alone. A tag cut
        # before the packaging existed has none of the files below, and the
        # dependency step would fail with a confusing pip error instead of
        # saying why. Fail here with the reason.
        shell: bash
        run: |
          missing=""
          for f in requirements-build.txt packaging/speccleanse.spec \
                   packaging/installer.iss packaging/check_notices.py \
                   apppaths.py THIRD_PARTY_NOTICES.txt; do
            [ -f "$f" ] || missing="${missing} ${f}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Ref '${{ steps.version.outputs.checkout_ref }}' is missing:${missing}"
            echo ""
            echo "Assets can only be built from a commit that contains the build"
            echo "tooling. A tag predating it cannot be built here — and should not"
            echo "be: v1.0.0 predates the fix for patterns.yaml being read from"
            echo "PyInstaller's temporary extraction directory, so the executable"
            echo "would ship a build whose pattern edits silently do nothing, and"
            echo "every tag up to v1.1.0 predates THIRD_PARTY_NOTICES.txt, so its"
            echo "assets would ship without the license notices of what they bundle."
            echo "Cut a new tag from a commit that has the packaging instead."
            exit 1
          fi
          echo "Packaging present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Check the third-party notices against this machine
        # The notices were assembled from upstream sources. This compares them,
        # word for word, with the license files of the Python, Tcl/Tk, lxml,
        # PyYAML and PyInstaller installed here — the ones about to be bundled —
        # and fails if any is missing or a version has moved on. See the
        # script's docstring for what is compared and why whitespace is not.
        run: python packaging/check_notices.py --require-runtime

      - name: Run tests
        # Windows has tkinter, so the GUI tests that skip on Linux run here.
        run: python -m unittest discover -s tests -t .

      - name: Build the executable
        run: pyinstaller packaging/speccleanse.spec --noconfirm

      - name: Check the executable was produced
        shell: bash
        run: |
          test -f dist/SpecCleanse.exe || { echo "PyInstaller produced no exe"; exit 1; }
          ls -lh dist/SpecCleanse.exe

      - name: List what the executable bundles
        # Every binary and data file inside the executable, for the log. This is
        # the list THIRD_PARTY_NOTICES.txt has to cover: when a dependency or a
        # new import brings in a library, it shows up here first.
        run: pyi-archive_viewer --list --brief dist/SpecCleanse.exe

      - name: Locate Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not present on the runner; installing it."
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Could not find ISCC.exe after installing Inno Setup" }
          Write-Host "Using $iscc"
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the installer
        run: >
          & "${{ steps.iscc.outputs.path }}"
          /DAppVersion=${{ steps.version.outputs.version }}
          packaging\installer.iss
        shell: pwsh

      - name: Fetch the LGPL corresponding source
        # GNU libiconv is the one LGPL component in the bundle, compiled into
        # lxml's etree.pyd. The release offers its source, and lxml's, from the
        # same page as the executables, so whoever has the binary can rebuild it
        # with a modified libiconv. The revisions are pinned and verified rather
        # than taken from whatever a tag or an index serves today: a tag can be
        # moved, and the source shipped must be the one that was built.
        #
        # LIBICONV_VERSION must match the notices and LXML_VERSION must match
        # requirements.txt; tests/test_packaging.py checks both on every PR.
        shell: bash
        env:
          LIBICONV_VERSION: "1.17"
          LIBICONV_REPO: https://github.com/winlibs/libiconv.git
          LIBICONV_COMMIT: 3b9151dad09ecb8e41e150f41d196f2792e1a1c6
          LXML_VERSION: "6.0.2"
          LXML_SDIST_URL: https://files.pythonhosted.org/packages/aa/88/262177de60548e5a2bfc46ad28232c9e9cbde697bd94132aeb80364675cb/lxml-6.0.2.tar.gz
          LXML_SDIST_SHA256: cd79f3367bd74b317dda655dc8fcfa304d9eb6e4fb06b7168c5cf27f96e0cd62
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/libiconv-src"
          git clone --quiet --depth 1 --branch "libiconv-${LIBICONV_VERSION}" "$LIBICONV_REPO" "$src"
          commit="$(git -C "$src" rev-parse HEAD)"
          if [ "$commit" != "$LIBICONV_COMMIT" ]; then
            echo "::error::Tag libiconv-${LIBICONV_VERSION} is now ${commit}, not ${LIBICONV_COMMIT}"
            exit 1
          fi
          git -C "$src" archive --format=tar.gz --prefix="libiconv-${LIBICONV_VERSION}/" \
            -o "${GITHUB_WORKSPACE}/dist/libiconv-${LIBICONV_VERSION}-source.tar.gz" HEAD

          curl -fsSL -o "dist/lxml-${LXML_VERSION}.tar.gz" "$LXML_SDIST_URL"
          echo "${LXML_SDIST_SHA256}  dist/lxml-${LXML_VERSION}.tar.gz" | sha256sum -c -

      - name: Stage the portable executable and the notices
        # The notices and the license are copied into dist/ so the artifact below
        # stays flat: upload-artifact keeps paths relative to the files' common
        # ancestor, which a file at the repository root would move up to the root.
        shell: bash
        run: |
          cp dist/SpecCleanse.exe "dist/SpecCleanse-${{ steps.version.outputs.version }}-portable.exe"
          cp THIRD_PARTY_NOTICES.txt dist/
          cp LICENSE.md dist/
          ls -lh dist/

      - name: Upload build artifacts
        # Kept regardless of whether the release upload below succeeds, so a
        # failed upload does not mean rebuilding.
        uses: actions/upload-artifact@v4
        with:
          name: speccleanse-windows-${{ steps.version.outputs.version }}
          path: |
            dist/SpecCleanse-${{ steps.version.outputs.version }}-portable.exe
            dist/SpecCleanse-Setup-${{ steps.version.outputs.version }}.exe
            dist/THIRD_PARTY_NOTICES.txt
            dist/LICENSE.md
            dist/libiconv-*-source.tar.gz
            dist/lxml-*.tar.gz
          if-no-files-found: error

      - name: Attach the assets to the release
        # Pull requests stop at the artifact above; only a tag produces a release.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          # The release may not exist yet when a tag is pushed on its own.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No release for $tag yet — creating one from the tag."
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" \
            "dist/SpecCleanse-${version}-portable.exe" \
            "dist/SpecCleanse-Setup-${version}.exe" \
            dist/THIRD_PARTY_NOTICES.txt \
            dist/LICENSE.md \
            dist/libiconv-*-source.tar.gz \
            dist/lxml-*.tar.gz \
            --clobber
