# SpecCleanse Detection Patterns Configuration
#
# This file is UTF-8 and contains ©, – and —.  It is always read as UTF-8
# (see docx_xml.load_config); keep it that way when editing on Windows.
#
# Each pattern set can be enabled/disabled and customized.  Every value under
# a `description:` key is documentation for the reader — nothing in the code
# reads it.  Regular expressions are compiled case-insensitively with DOTALL,
# so `^` anchors to the start of a paragraph, not of every line.

specifier_notes:
  enabled: true
  description: "Editorial comments meant for specifiers, not final spec"
  
  # Text patterns (case-insensitive regex)
  text_patterns:
    - '\[specifier[:\s].*?\]'           # [Specifier: ...]
    - '\[note to specifier\]'           # [NOTE TO SPECIFIER]
    - 'note to specifier[:\s]'          # NOTE TO SPECIFIER:
    - '\[specifier note\]'              # [Specifier Note]
    - '\[edit.*?note.*?\]'              # [Edit Note], [Editor's Note]
    - '\[coordinator.*?note.*?\]'       # [Coordinator Note]
    - '<specifier.*?>'                  # <Specifier Note>
    - '^\s*\*\*\*.*?\*\*\*\s*$'         # *** specifier notes ***

  # Remove text that carries editorial formatting (italic plus an editorial
  # colour) even when no pattern matches it.
  #
  # OFF by default.  This is the only mechanism in the tool that removes text
  # on no content evidence at all — no pattern, no style, only how the text
  # looks — and specification content is routinely red and italic where a
  # decision is still pending.  A retained note costs some noise in whatever
  # reads the cleaned file; a deleted requirement is not recoverable from it.
  #
  # Turn it on if your firm marks notes *only* by italic-plus-colour and
  # nothing else distinguishes them.  Removals it causes are labelled
  # "formatting-only" in the Preview report, and
  #   python -m tools.census_formatting <your specs>
  # reports what the setting is worth on your own documents, in both
  # directions, without changing anything.
  formatting_only_removal: false

  # Formatting indicators (if text has these, increase confidence)
  formatting_signals:
    colors:
      - "FF0000"  # Red
      - "C00000"  # Dark red
      - "0000FF"  # Blue
      - "0070C0"  # Light blue

copyright_notices:
  enabled: true
  description: "Boilerplate copyright text"

  # A single match here scores 0.7, which clears the 0.5 removal threshold on
  # its own — so every pattern below has to be sufficient by itself.  Only
  # unambiguous markers are.
  #
  # Reproduction and duplication language is not a marker.  It says the same
  # thing, about the same act, in a copyright notice and in an ordinary
  # requirement; what differs is who is imposing the restriction, and that is
  # not in the text.  Every attempt to separate them by wording failed against
  # routine specification prose:
  #
  #   'may not be reproduced'      took "Shop Drawings submitted under this
  #                                Section may not be reproduced for use on
  #                                other projects."
  #   ...narrowed to require "in whole or in part" / "without written
  #      permission", which then took "Shop Drawings may not be reproduced in
  #      whole or in part without the Architect's written consent." — the same
  #      boilerplate a notice uses, because a submittal restriction is
  #      boilerplate too.
  #
  #   'duplication.*?prohibited'   took "...duplication of sprinkler coverage in
  #                                adjacent zones is prohibited by the AHJ."
  #   ...narrowed to require adjacency, which then took "Duplication of keys is
  #      prohibited without written authorization from the Owner." — standard
  #      door-hardware key control.
  #
  #   'unauthorized.*?reproduction'
  #                                took "Unauthorized personnel shall not have
  #                                access to the fire pump room; reproduction of
  #                                access keys is not permitted."
  #   ...narrowed to require adjacency, which then took "Provide keys designed
  #      to prevent unauthorized duplication." — the same three words, in a
  #      requirement.
  #
  # They are gone.  A notice carrying no ©, no "copyright" and no "all rights
  # reserved" now survives, which is the accepted cost: it is one line of
  # boilerplate in whatever reads the cleaned file, against a deleted
  # requirement that is not recoverable from it.  The notice blocks this tool
  # actually targets — MasterSpec, ARCOM, SpecLink — all carry a marker.
  text_patterns:
    - '©\s*\d{4}'                       # © 2026 — not a bare © (e.g. "Excel© file")
    - 'copyright\s*©'
    - 'copyright\s+\d{4}'
    - 'all\s+rights\s+reserved'
    - 'exclusively\s+published\s+and\s+distributed'   # ARCOM distribution notice

    # Anchored: a licence line opens with it.  Unanchored it took "Software
    # licensed for use by the Owner shall be transferable."
    - '^\s*licensed\s+for\s+use\s+by'

hidden_text:
  enabled: true
  description: "Content marked as hidden in Word (w:vanish), detected from the
    XML rather than from any pattern"

specagent_references:
  enabled: true
  description: "SpecAgent.com watermarks and references"
  
  text_patterns:
    # Bounded so it matches the watermark and the domain but cannot fire inside
    # a longer word.  This detector scores 1.0, so it needs to be exact.
    - '\bspec\s*agent\b'               # covers specagent.com, www.specagent, etc.

editorial_artifacts:
  enabled: true
  description: "Placeholder instructions and editing artifacts"

  # ── Three tiers ─────────────────────────────────────────────────────
  #
  # text_patterns (high-confidence, whole paragraph):
  #   Matched content gets confidence 0.8 — above the 0.5 removal
  #   threshold on text match alone, and the whole paragraph goes.  Use
  #   this tier only for paragraphs that are editorial from end to end:
  #   standalone retain/delete instructions and delimited markers.
  #
  # low_confidence_patterns (whole paragraph, needs formatting):
  #   Matched content starts at confidence 0.3 — below the removal
  #   threshold.  It will ONLY be removed if editorial formatting
  #   signals push it past 0.5:
  #     +0.2  italic text
  #     +0.3  editorial color (red, dark red, blue, light blue)
  #     +0.8  editorial paragraph or character style
  #
  #   Use this tier for bare-prose patterns that could plausibly
  #   appear in real specification content (e.g., "revise as required",
  #   "coordinate specifications for").
  #
  # inline_patterns (cut out of the paragraph, paragraph kept):
  #   Placeholders that sit *inside* real requirement text.  MasterSpec
  #   writes "Provide two [Verify quantity with Owner] spare filters per
  #   unit."; deleting that paragraph deletes a requirement.  These
  #   matches are cut out where they stand and the sentence around them
  #   survives.  A paragraph left with nothing but placeholders is
  #   removed in full.
  # ────────────────────────────────────────────────────────────────────

  # High-confidence patterns — safe to remove the whole paragraph on text match.
  text_patterns:
    # Retain/delete instructions.  'retain or delete' is anchored to the start
    # of the paragraph, optionally inside a bracket, so it fires when the
    # paragraph *is* the instruction and not when a requirement merely contains
    # the marker: "Provide two [retain or delete] spare filters per unit." keeps
    # its text, brackets and all.  Cutting the marker out would need an inline
    # rule, and inventing one broad enough to catch it would put every bracketed
    # phrase in a requirement at risk.
    - '^\s*\[?\s*retain\s+or\s+delete\b'
    - 'delete\s+if\s+not\s+(applicable|required|used)'
    - 'retain\s+if\s+(applicable|required|used)'
    - 'delete\s+options?\s+not\s+(applicable|required|selected)'

    # "Select one of the following paragraphs" is an instruction to a specifier;
    # "Select one of the listed manufacturers" is an instruction to a
    # contractor, and the two are indistinguishable from the opening words
    # alone.  What separates them is what is being selected *from*: an editorial
    # note points at the document's own structure.  Requiring that referent
    # keeps the requirement; the (?!-) still rules out "Select one-piece".
    - '^\s*(?:select|choose)\s+one\b(?!-)[^.]{0,40}\b(?:above|below|following|paragraphs?|subparagraphs?|options?|articles?)\b'

    # Common editing instructions
    - 'delete\s+this\s+(paragraph|section|line)'
    - 'remove\s+this\s+(paragraph|section|line)'

    # MasterSpec / ARCOM editorial instructions.  Anchored to the start of the
    # paragraph and required to point somewhere ("above"/"below") within the
    # same sentence, so they cannot fire on real requirements such as "Retain
    # records of all tests required in Paragraph 1.6."
    - '^\s*retain\s+(?:\w+\s+){0,4}(?:sub)?paragraphs?\b[^.]{0,60}\b(?:above|below)\b'
    - '^\s*copy\s+(?:\w+\s+){0,4}(?:sub)?paragraphs?\b[^.]{0,60}\b(?:above|below)\b'
    - 'see\s+(evaluations|editing\s+instruction)'

    # Section markers that aren't content
    - '---+\s*optional\s*---+'
    - '===+\s*optional\s*===+'
    - '\*{3,}\s*optional\s*\*{3,}'
    
  # Low-confidence patterns — require formatting confirmation to remove.
  low_confidence_patterns:
    - 'revise\s+as\s+required'
    - 'edit\s+as\s+required'
    - 'modify\s+as\s+required'
    - 'to\s+be\s+determined'
    - 'fill\s+in\s+(the\s+)?blank'
    - 'complete\s+this\s+section'
    - 'optional\s+paragraph'
    - 'alternate\s+paragraph'
    - 'use\s+this\s+section\s+if'
    - 'revise\s+this\s+section'
    - 'this\s+section\s+uses\s+the\s+term'
    - 'coordinate\s+specifications\s+for'

  # Inline placeholders — cut out in place, the paragraph around them stays.
  inline_patterns:
    # Fill-in instructions
    - '<insert\s*[^<>]*?>'
    - '\[insert\s*[^\[\]]*?\]'
    - '\{insert\s*[^{}]*?\}'
    - '<enter\s*[^<>]*?>'
    - '\[enter\s*[^\[\]]*?\]'
    - '\[verify\s*[^\[\]]*?\]'
    - '\[confirm\s*[^\[\]]*?\]'
    - '\[coordinate\s*[^\[\]]*?\]'

    # Empty placeholders
    - '\[\s*\]'                         # Empty brackets
    - '<\s*>'                           # Empty angle brackets
    - '\[_+\]'                          # [___]
    - '<_+>'                            # <___>
    - '\[\.\.+\]'                       # [...]
    - '\[tbd\]'
    - '\[n/a\]'
    - '\[pending\]'

# Content that should NEVER be removed (whitelist)
preserve_patterns:
  enabled: true
  description: "Patterns to always preserve even if they match removal rules"
  
  text_patterns:
    # Only protect actual section/part headings at start of line
    - '^\s*end\s+of\s+section'
    - '^\s*section\s+\d{2}\s?\d{2}\s?\d{2}'  # MasterFormat: "SECTION 23 05 00"
    - '^\s*section\s+\d{4,}'                 # Older numbering: "SECTION 238126"
    - '^\s*part\s+\d+\b'                     # Part headings: "PART 1 - GENERAL"
    - '^\s*article\s+\d+\s*[-–—:]'           # Article headings

# Advanced: Style-based detection
style_based_detection:
  enabled: true
  description: "Detect content based on paragraph/character style names.
    Names are matched against the style ID and against the display name in
    word/styles.xml, and styles that inherit from one of these are matched
    too, so 'Specifier Note' and 'SpecifierNote' both work."
  
  # Paragraph styles that indicate specifier content
  paragraph_styles:
    - "CMT"
    - "SpecifierNote"
    - "EditorNote"
    - "EditorialNote"
    - "NotetoSpecifier"
    - "CoordinatorNote"
    
  # Character styles that indicate specifier content  
  character_styles:
    - "SpecifierNote"
    - "EditorNote"
    - "Hidden"

  # Structural styles that mark a heading, whatever its text says.  MasterSpec
  # numbers parts and articles automatically, so the heading "PART 1 - GENERAL"
  # extracts as just "GENERAL" and no text pattern can recognise it.
  #
  # A paragraph in one of these styles is protected whole: nothing inside it is
  # removed or redacted.  That is why the requirement styles PR1 through PR5 are
  # deliberately absent — they carry the body of the specification, which is
  # exactly where the placeholders that need redacting live.
  preserve_styles:
    - "SCT"    # section title
    - "PRT"    # part heading
    - "ART"    # article heading
    - "EOS"    # end of section
